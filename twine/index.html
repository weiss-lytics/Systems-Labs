<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twine — Finding time, together</title>
<style>
/* ── Tokens ── */
:root {
  --bg:        #110b1a;
  --bg2:       #1b1428;
  --card:      #251d36;
  --card2:     #2e2440;
  --border:    rgba(216,196,240,0.08);
  --border2:   rgba(216,196,240,0.18);
  --border3:   rgba(216,196,240,0.32);
  --accent:    #c9a8e8;
  --accent2:   #e8b8d4;
  --accent-dim:rgba(201,168,232,0.14);
  --accent-glow:rgba(201,160,220,0.3);
  --text:      #f3eefb;
  --text2:     #a8a0c0;
  --text3:     #655c7e;
  --green:     #a8d8b0;
  --yellow:    #e8d09a;
  --red:       #e0a8b0;
  --green-bg:  rgba(168,216,176,0.12);
  --yellow-bg: rgba(232,208,154,0.12);
  --red-bg:    rgba(224,168,176,0.12);
  --r:         18px;
  --r-sm:      12px;
  --shadow:    0 8px 32px rgba(0,0,0,0.45);
  --card-shadow: 0 2px 8px rgba(10,4,18,0.18), 0 12px 28px rgba(10,4,18,0.28);
  --card-shadow-hover: 0 2px 10px rgba(10,4,18,0.2), 0 16px 36px rgba(10,4,18,0.32);
  --card-highlight: inset 0 1px 0 rgba(255,255,255,0.04);
  --t:         0.25s cubic-bezier(.4,0,.2,1);
  --gradient:  linear-gradient(135deg, #c9a8e8 0%, #e8b8d4 50%, #d4a0d8 100%);
}
[data-theme="light"] {
  --bg:        #f7eef8;
  --bg2:       #f8f0fa;
  --card:      #ffffff;
  --card2:     #fbf3fc;
  --border:    rgba(180,140,190,0.10);
  --border2:   rgba(160,110,180,0.20);
  --border3:   rgba(140,90,160,0.38);
  --accent:    #a877cc;
  --accent2:   #d488ae;
  --accent-dim:rgba(168,119,204,0.12);
  --accent-glow:rgba(200,140,210,0.24);
  --text:      #2c2138;
  --text2:     #7c6e92;
  --text3:     #c4b4d4;
  --green:     #4a9858;
  --yellow:    #b8880a;
  --red:       #c0586c;
  --green-bg:  rgba(74,152,88,0.1);
  --yellow-bg: rgba(184,136,10,0.1);
  --red-bg:    rgba(192,88,108,0.1);
  --shadow:    0 4px 24px rgba(180,120,180,0.12);
  --card-shadow: 0 1px 3px rgba(140,90,150,0.06), 0 10px 26px rgba(160,110,170,0.12);
  --card-shadow-hover: 0 2px 6px rgba(140,90,150,0.08), 0 14px 32px rgba(160,110,170,0.16);
  --card-highlight: inset 0 1px 0 rgba(255,255,255,0.6);
  --gradient:  linear-gradient(135deg, #b888d4 0%, #e8a8c8 50%, #c888d0 100%);
}

/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body, .section-card, .glance-card, .timeline-card, .best-card, .alt-card,
.custom-select-btn, .field-input, .dp-search, .utc-badge, .dropdown-panel,
.you-badge, .badge, .topbar-clock{
  transition:background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:80px;
}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;
  max-width:620px;margin:0 auto;
}
.topbar-clock{
  display:flex;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:40px;
  padding:8px 16px;
  font-size:13px;color:var(--text2);
  transition:background var(--t),border-color var(--t);
}
.topbar-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent-glow);
  flex-shrink:0;
}
.topbar-time{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.topbar-city{color:var(--text2)}

.theme-area{display:flex;align-items:center;gap:10px}
.theme-icon{font-size:16px;user-select:none}
.toggle-pill{
  width:46px;height:26px;border-radius:13px;
  background:var(--accent);
  border:none;cursor:pointer;position:relative;
  transition:background var(--t);
  flex-shrink:0;
}
.toggle-pill:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.toggle-pill::after{
  content:'';position:absolute;
  top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;
  transition:transform var(--t);
  box-shadow:0 1px 4px rgba(0,0,0,0.3);
}
[data-theme="light"] .toggle-pill::after{transform:translateX(20px)}

/* ── Brand ── */
.brand-row{
  display:flex;align-items:baseline;gap:7px;
  margin-bottom:3px;
}
.brand-sparkle{font-size:11px;opacity:0.75;position:relative;top:-1px}
.brand-name{
  font-size:14px;font-weight:700;letter-spacing:0.4px;
  color:var(--accent);
}
.brand-tagline{
  font-size:12px;color:var(--text3);font-weight:400;
  letter-spacing:0.1px;
}

/* ── Wrap ── */
.wrap{max-width:620px;margin:0 auto;padding:0 20px}

/* ── Greeting hero ── */
.hero{padding:10px 0 34px}
.greeting-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.greeting-emoji{font-size:25px;line-height:1}
.hero h1{
  font-size:clamp(25px,6vw,34px);
  font-weight:700;
  letter-spacing:-0.8px;
  line-height:1.15;
  color:var(--text);
}
.hero h1 em{
  font-family:Georgia,'Times New Roman',serif;
  font-style:italic;
  font-weight:400;
  color:var(--accent);
  letter-spacing:-0.5px;
}
.hero-meta{
  display:flex;align-items:center;gap:9px;
  font-size:14px;color:var(--text2);
  flex-wrap:wrap;
}
.hero-meta .dot-sep{color:var(--text3);font-size:12px}
.hero-meta b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.hero-city-line{
  display:flex;align-items:center;gap:7px;
  font-size:14px;color:var(--text2);
  margin-top:7px;
}
.hero-subline{
  font-size:15px;color:var(--text2);
  margin-top:16px;font-weight:400;
  letter-spacing:0.1px;
}

/* ── Section card ── */
.section-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:22px;
  margin-bottom:14px;
  box-shadow:var(--card-shadow), var(--card-highlight);
  transition:background var(--t),border-color var(--t),box-shadow var(--t),transform var(--t);
}
.section-card:hover{
  transform:translateY(-1px);
  box-shadow:var(--card-shadow-hover), var(--card-highlight);
}
.section-label{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;
  color:var(--text2);
  margin-bottom:16px;
  letter-spacing:0.1px;
}
.section-label-icon{font-size:15px}

/* ── Custom select (your timezone) ── */
.custom-select-wrap{position:relative}
.custom-select-btn{
  width:100%;
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  color:var(--text);
  font-size:15px;font-family:inherit;
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;
  transition:border-color var(--t),background var(--t),box-shadow var(--t);
  text-align:left;
}
.custom-select-btn:hover{border-color:var(--border3)}
.custom-select-btn:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.custom-select-btn.open{
  border-color:rgba(201,168,232,0.5);
  box-shadow:0 0 0 4px var(--accent-dim);
}
.csb-left{display:flex;align-items:center;gap:10px}
.csb-flag{font-size:17px}
.csb-city{font-weight:500}
.csb-arrow{font-size:11px;color:var(--text3);transition:transform var(--t)}
.custom-select-btn.open .csb-arrow{transform:rotate(180deg)}

/* ── Dropdown panel ── */
.dropdown-panel{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  z-index:200;
  display:none;
  overflow:hidden;
}
.dropdown-panel.open{display:block}
.dp-search-wrap{padding:12px 12px 8px}
.dp-search{
  width:100%;
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  color:var(--text);
  font-size:14px;font-family:inherit;
  padding:12px 16px 12px 38px;
  outline:none;
  transition:border-color var(--t),box-shadow var(--t);
}
.dp-search:focus{
  border-color:rgba(201,168,232,0.5);
  box-shadow:0 0 0 4px var(--accent-dim);
}
.dp-search::placeholder{color:var(--text3)}
.dp-search-wrap{position:relative}
.dp-search-icon{
  position:absolute;left:22px;top:50%;transform:translateY(-50%);
  font-size:14px;color:var(--text3);pointer-events:none;
}
.dp-list{max-height:260px;overflow-y:auto;padding-bottom:8px}
.dp-list::-webkit-scrollbar{width:3px}
.dp-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.dp-region{
  font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:1.2px;
  color:var(--text3);
  padding:10px 16px 5px;
}
.dp-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px;
  cursor:pointer;
  font-size:14px;color:var(--text);
  transition:background var(--t);
  gap:10px;
}
.dp-item:hover{background:var(--accent-dim)}
.dp-item.selected{background:var(--accent-dim);color:var(--accent)}
.dp-item-left{display:flex;align-items:center;gap:10px}
.dp-flag{font-size:16px}
.dp-city{font-weight:500}
.dp-utc{font-size:12px;color:var(--text3)}

/* ── Their timezones ── */
.participant-row{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;
}
.participant-row .custom-select-wrap{flex:1}
.utc-badge{
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:20px;
  padding:7px 12px;
  font-size:12px;font-weight:500;
  color:var(--text2);
  white-space:nowrap;
  flex-shrink:0;
  transition:background var(--t);
}
.remove-participant{
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid var(--border2);
  color:var(--text3);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background var(--t),color var(--t),border-color var(--t);
  font-family:inherit;
  line-height:1;
}
.remove-participant:hover{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.remove-participant:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add-tz-btn{
  width:100%;
  background:transparent;
  border:1.5px dashed var(--border2);
  border-radius:var(--r-sm);
  color:var(--text3);
  font-size:14px;font-family:inherit;
  padding:12px;
  cursor:pointer;
  transition:border-color var(--t),color var(--t),background var(--t);
  letter-spacing:0.2px;
}
.add-tz-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.add-tz-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty-hint{
  font-size:13.5px;color:var(--text2);
  margin-bottom:10px;text-align:center;
  padding:4px 0;
}

/* ── Date & time inputs ── */
.date-time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.field-group label{
  display:block;font-size:12px;color:var(--text2);
  margin-bottom:6px;letter-spacing:0.2px;
}
.field-input{
  width:100%;
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  color:var(--text);
  font-size:15px;font-family:inherit;
  padding:13px 16px;
  outline:none;
  transition:border-color var(--t),box-shadow var(--t),background var(--t);
  -webkit-appearance:none;appearance:none;
  color-scheme:dark;
}
[data-theme="light"] .field-input{color-scheme:light}
.field-input:focus{
  border-color:rgba(201,168,232,0.5);
  box-shadow:0 0 0 4px var(--accent-dim);
}
.field-full{grid-column:1/-1}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── CTA ── */
.find-btn{
  width:100%;
  background:var(--gradient);
  color:#fff;border:none;
  border-radius:22px;
  padding:18px;
  font-size:16px;font-weight:600;font-family:inherit;
  letter-spacing:0.2px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(160,110,200,0.18), 0 0 28px var(--accent-glow);
  transition:opacity 0.3s ease,transform 0.25s cubic-bezier(.34,1.56,.64,1),box-shadow 0.35s ease;
  margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.find-btn:hover{
  opacity:0.96;
  transform:translateY(-2px) scale(1.01);
  box-shadow:0 6px 20px rgba(160,110,200,0.22), 0 0 40px var(--accent-glow);
}
.find-btn:active{
  transform:translateY(0) scale(0.985);
  opacity:0.9;
  transition:transform 0.1s ease,opacity 0.1s ease;
}
.find-btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.find-btn-star{font-size:14px;opacity:0.9}

/* ── Glance section ── */
.glance-label{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;
  color:var(--text2);
  margin:20px 0 10px;
}
.glance-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 6px var(--accent-glow);
}
.glance-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:var(--card-shadow), var(--card-highlight);
  transition:background var(--t),border-color var(--t);
}
.glance-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  transition:border-color var(--t);
}
.glance-row:last-child{border-bottom:none}
.glance-left{display:flex;align-items:center;gap:10px}
.glance-flag{font-size:18px}
.glance-city{font-weight:500;font-size:14px}
.glance-utc{font-size:12px;color:var(--text3);margin-top:1px}
.glance-right{display:flex;align-items:center;gap:10px}
.glance-time{
  font-size:22px;font-weight:600;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.5px;
}
.you-badge{
  background:var(--accent-dim);
  color:var(--accent);
  border:1px solid rgba(201,160,196,0.3);
  border-radius:20px;
  padding:3px 9px;
  font-size:11px;font-weight:600;
  letter-spacing:0.5px;
}

/* ── Results ── */

/* — Best match: the hero card, primary visual focus — */
.best-card{
  background:linear-gradient(165deg, var(--card2) 0%, var(--card) 60%);
  border:1px solid rgba(201,168,232,0.22);
  border-radius:var(--r);
  overflow:hidden;
  margin-bottom:18px;
  position:relative;
  box-shadow:0 0 0 1px rgba(201,168,232,0.05), 0 4px 16px rgba(10,4,18,0.2), 0 20px 48px rgba(160,110,200,0.16);
  transition:transform var(--t),box-shadow var(--t);
  cursor:pointer;
}
.best-card:hover{
  transform:translateY(-3px);
  box-shadow:0 0 0 1px rgba(201,168,232,0.08), 0 6px 20px rgba(10,4,18,0.22), 0 28px 56px rgba(160,110,200,0.22);
}
.best-card::before{
  content:'';position:absolute;inset:0;
  background:var(--gradient);opacity:0.07;pointer-events:none;
}
.best-card-glow{
  position:absolute;top:-50%;right:-25%;width:70%;height:140%;
  background:radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  opacity:0.55;pointer-events:none;
}
.best-card-glow-2{
  position:absolute;bottom:-40%;left:-15%;width:50%;height:100%;
  background:radial-gradient(circle, rgba(232,184,212,0.22) 0%, transparent 70%);
  opacity:0.5;pointer-events:none;
}
.best-eyebrow{
  display:flex;align-items:center;gap:7px;
  padding:26px 28px 0;
  font-size:13.5px;font-weight:600;color:var(--accent);
  position:relative;z-index:1;
  letter-spacing:0.1px;
}
.best-stops{
  padding:18px 28px 4px;
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;
}
.best-stop{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;
}
.best-stop-time{
  font-size:42px;font-weight:700;
  letter-spacing:-1.5px;color:var(--text);
  font-variant-numeric:tabular-nums;
  line-height:1.05;
}
.best-stop-place{
  display:flex;align-items:center;gap:6px;
  font-size:14px;color:var(--text2);
}
.best-stop-flag{font-size:16px}
.best-arrow{
  font-size:15px;color:var(--text3);opacity:0.7;
  margin:2px 0;
}
.best-note{
  text-align:center;
  padding:14px 28px 0;
  font-size:13.5px;color:var(--text2);line-height:1.55;
  position:relative;z-index:1;
}
.best-people-extra{
  padding:16px 28px 4px;
  border-top:1px solid var(--border);
  margin-top:18px;
  display:flex;flex-direction:column;gap:9px;
  position:relative;z-index:1;
}
.best-person-row{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13.5px;
}
.best-person-left{display:flex;align-items:center;gap:9px;color:var(--text2)}
.best-person-flag{font-size:16px}
.best-person-time{font-weight:600;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.best-copy-row{padding:18px 28px 26px;position:relative;z-index:1;display:flex;justify-content:center}

/* — Alternative cards: compact, secondary — */
.alt-label{
  font-size:12px;font-weight:600;color:var(--text3);
  margin:20px 0 9px;
  letter-spacing:0.1px;
}
.alt-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  overflow:hidden;
  margin-bottom:8px;
  box-shadow:0 1px 2px rgba(10,4,18,0.08);
  transition:border-color var(--t),background var(--t),box-shadow var(--t),transform var(--t);
  cursor:pointer;
  opacity:0.92;
}
.alt-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--card-shadow);opacity:1}
.alt-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 17px;
}
.alt-left{display:flex;align-items:center;gap:10px}
.alt-time{font-size:15px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.alt-people-inline{font-size:12px;color:var(--text3)}
.alt-copy-row{padding:0 17px 13px;display:none}

.badge{
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;font-weight:500;
  display:flex;align-items:center;gap:5px;
  flex-shrink:0;
}
.badge-works{
  background:var(--green-bg);
  color:var(--green);
}
.badge-rough{
  background:var(--red-bg);
  color:var(--red);
}

.comfort-pip{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
.pip-great{background:var(--green)}
.pip-ok{background:var(--yellow)}
.pip-bad{background:var(--red)}

.copy-btn{
  background:var(--card2);
  border:1px solid var(--border2);
  border-radius:var(--r-sm);
  color:var(--text2);font-size:12px;font-family:inherit;
  padding:8px 16px;
  cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:border-color 0.2s ease,color 0.2s ease,background 0.2s ease,transform 0.2s cubic-bezier(.34,1.56,.64,1);
}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);transform:translateY(-1px)}
.copy-btn:active{transform:translateY(0) scale(0.96)}
.copy-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Timeline ── */
.timeline-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:18px 20px;
  margin-bottom:14px;
  box-shadow:var(--card-shadow), var(--card-highlight);
  transition:background var(--t),border-color var(--t);
}
.timeline-head{
  font-size:12px;color:var(--text2);font-weight:500;
  margin-bottom:14px;
}
.tl-row{margin-bottom:18px;position:relative}
.tl-city{
  font-size:12px;color:var(--text2);
  display:flex;align-items:center;gap:6px;
  margin-bottom:6px;
}
.tl-bar{
  height:24px;background:var(--card2);
  border-radius:12px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(10,4,18,0.12);
}
.tl-seg{position:absolute;top:0;height:100%;border-radius:12px}
.tl-seg-pref{background:linear-gradient(90deg, rgba(201,168,232,0.42), rgba(232,184,212,0.42))}
.tl-seg-ok{background:rgba(201,168,232,0.13)}
.tl-best{
  position:absolute;top:3px;bottom:3px;
  width:3px;background:var(--accent);border-radius:3px;z-index:3;
  box-shadow:0 0 8px var(--accent-glow);
}
.tl-bar-wrap{position:relative}
.tl-best-sparkle{
  position:absolute;top:-13px;
  font-size:11px;z-index:5;transform:translateX(-50%);
  filter:drop-shadow(0 0 4px var(--accent-glow));
  pointer-events:none;
}
.tl-now{
  position:absolute;top:0;bottom:0;
  width:1.5px;background:var(--accent2);opacity:0.5;border-radius:2px;z-index:4;
}
.tl-hours{
  display:flex;justify-content:space-between;
  margin-top:4px;padding:0 2px;
}
.tl-hours span{font-size:10px;color:var(--text3)}
.tl-legend{
  display:flex;gap:16px;margin-top:12px;
  flex-wrap:wrap;
}
.tl-legend-item{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text3);
}
.tl-legend-dot{
  width:10px;height:10px;border-radius:5px;flex-shrink:0;
}

/* ── Empty ── */
.empty-state{
  text-align:center;padding:32px 20px;
  color:var(--text3);font-size:14px;line-height:1.7;
}
.empty-state .empty-icon{font-size:28px;margin-bottom:8px;opacity:0.6}

/* ── Searching state ── */
.searching-state{
  text-align:center;padding:36px 20px;
  color:var(--text2);font-size:14px;
}
.searching-emoji{
  font-size:26px;margin-bottom:10px;
  display:inline-block;
  animation:gentle-pulse 1.4s ease-in-out infinite;
}
@keyframes gentle-pulse{
  0%,100%{transform:scale(1);opacity:0.85}
  50%{transform:scale(1.12);opacity:1}
}
.searching-sub{font-size:12.5px;color:var(--text3);margin-top:4px}

/* ── Outcome banner (perfect overlap / few good options) ── */
.outcome-banner{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  border-radius:var(--r-sm);
  font-size:13.5px;
  margin-bottom:14px;
  background:var(--accent-dim);
  color:var(--text);
  border:1px solid rgba(201,168,232,0.22);
}
.outcome-emoji{font-size:18px;flex-shrink:0}
.outcome-banner b{font-weight:600}

/* ── Animations ── */
.fade-up{animation:fadeUp 0.35s cubic-bezier(.4,0,.2,1)}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes sparkle-spin{
  0%{transform:rotate(0deg) scale(1)}
  50%{transform:rotate(15deg) scale(1.15)}
  100%{transform:rotate(0deg) scale(1)}
}
.sparkle{display:inline-block;animation:sparkle-spin 2.2s ease-in-out infinite}

/* ── Responsive ── */
@media(max-width:480px){
  .date-time-grid,.time-row{grid-template-columns:1fr}
  .field-full{grid-column:auto}
  .hero h1{font-size:26px}
}

/* ── Reduced motion ── */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
}
</style>

function setToday(){

  const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('meetDate').value = s;

/* ══ Theme ══ */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeIcon').textContent = next === 'dark' ? '🌙' : '☀️';
  const toggle = document.getElementById('themeToggle');
  toggle.setAttribute('aria-checked', next === 'light' ? 'true' : 'false');
  toggle.setAttribute('aria-label', next === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
}

/* ══ Greeting + clock ══ */
function getGreeting(hour){
  if(hour >= 5 && hour < 12) return { emoji:'☀️', text:'Good morning' };
  if(hour >= 12 && hour < 18) return { emoji:'☁️', text:'Good afternoon' };
  return { emoji:'🌙', text:'Good evening' };
}
function renderGreeting(){
  document.getElementById('heroCity').textContent = `${ownerEntry.flag} ${ownerEntry.label}`;
}
function startClock(){
  if(clockInterval) clearInterval(clockInterval);
  function tick(){
    const now = new Date();
    const hour = parseInt(new Intl.DateTimeFormat('en-US',{timeZone:ownerTz,hour:'numeric',hour12:false}).format(now), 10);
    const { emoji, text } = getGreeting(hour);
    document.getElementById('greetingEmoji').textContent = emoji;
    document.getElementById('greetingText').textContent = text;
    document.getElementById('heroTime').textContent = getTimeInTz(ownerTz, now);
    document.getElementById('heroDate').textContent = new Intl.DateTimeFormat('en-US',{timeZone:ownerTz,weekday:'short',month:'short',day:'numeric'}).format(now);
    updateGlanceTimes();
  }
  tick();
  clockInterval = setInterval(tick, 10000);
}

/* ══ Time helpers ══ */
function getTimeInTz(tz, date){
  try{
    return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).format(date);
  }catch(e){return '--:--'}
}
function getUtcLabel(tz){
  try{
    const parts = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(new Date());
    return parts.find(p=>p.type==='timeZoneName')?.value || tz;
  }catch(e){return tz}
}
function getMinutesInTz(tz, date){
  try{
    const parts = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'numeric',hour12:false}).formatToParts(date);
    const h = parseInt(parts.find(p=>p.type==='hour')?.value||'0');
    const m = parseInt(parts.find(p=>p.type==='minute')?.value||'0');
    return h*60+m;
  }catch(e){return 0}
}
function getTzOffsetMinutes(tz, date){
  try{
    const u = new Date(date.toLocaleString('en-US',{timeZone:'UTC'}));
    const l = new Date(date.toLocaleString('en-US',{timeZone:tz}));
    return (l-u)/60000;
  }catch(e){return 0}
}

      });

    ownerTz=tz; ownerEntry=ALL_CITIES.find(c=>c.tz===tz)||{city:tz,country:'',label:tz,flag:'🌍',tz};

function normalizeForSearch(s){
  // Strips accents so "sao paulo" matches "São Paulo", "bogota" matches "Bogotá", etc.
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function renderDropdownList(listId, query, onSelect){
  const list = document.getElementById(listId);
  const q = normalizeForSearch(query.trim());
  let html = '';
  REGIONS.forEach(r=>{
    const matches = q ? r.cities.filter(c=>
      normalizeForSearch(c.label).includes(q) ||
      normalizeForSearch(c.country).includes(q) ||
      normalizeForSearch(c.city).includes(q)
    ) : r.cities;
    if(!matches.length) return;
    html += `<div class="dp-region">${r.region}</div>`;
    matches.forEach(c=>{
      html += `<div class="dp-item" data-tz="${c.tz}" data-label="${c.label}" data-flag="${c.flag}">
        <div class="dp-item-left"><span class="dp-flag">${c.flag}</span><span class="dp-city">${c.label}</span></div>
        <span class="dp-utc">${getUtcLabel(c.tz)}</span>
      </div>`;
    });
  });
  if(!html) html = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px;">No results</div>';
  list.innerHTML = html;
  list.querySelectorAll('.dp-item').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); onSelect(el.dataset.tz, el.dataset.label, el.dataset.flag); });
  });
}

function closeAllDropdowns(){

      const city = ALL_CITIES.find(c=>c.tz===tz) || {city:tz,country:'',label:tz,flag:flag||'🌍',tz};
      const idx = participants.findIndex(x=>x.id===p.id);

function updateGlanceTimes(){
  const now = new Date();
  // owner
  const ot = document.getElementById('glance-time-owner');
  if(ot) ot.textContent = getTimeInTz(ownerTz, now);
  // participants
  participants.forEach(p=>{
    const el = document.getElementById(`glance-time-${p.id}`);
    if(el) el.textContent = getTimeInTz(p.tz, now);
  });
}

/* ══ Find meetings ══ */
function findMeetings(){
  if(!participants.length){ alert('Add at least one person to meet with!'); return; }

  showSearchingState();

  // Brief, friendly pause so the searching state is felt (not just a flash)
  setTimeout(()=>{
    const dateVal = document.getElementById('meetDate').value;
    const [startH, startM] = document.getElementById('timeStart').value.split(':').map(Number);
    const [endH, endM] = document.getElementById('timeEnd').value.split(':').map(Number);
    const prefStart = startH*60 + startM;
    const prefEnd = endH*60 + endM;

    const [y,mo,d] = dateVal.split('-').map(Number);
    const dayBase = new Date(y, mo-1, d);

    const ownerOffset = getTzOffsetMinutes(ownerTz, dayBase);

    const candidates = [];
    for(let min=0; min<24*60; min+=30){
      const utcMs = dayBase.getTime() + min*60000 - ownerOffset*60000;
      const slotUtc = new Date(utcMs);
      let score = 0;
      const comfort = [];
      const allEntries = [{...ownerEntry, isOwner:true, id:'owner'}, ...participants];
      allEntries.forEach(p=>{
        const m = getMinutesInTz(p.tz, slotUtc);
        const c = scoreComfort(m, prefStart, prefEnd);
        comfort.push({p, m, c});
        score += c === 'great' ? 2 : c === 'ok' ? 0.5 : -2;
      });
      candidates.push({slotUtc, score, comfort, ownerMin:min});
    }

    candidates.sort((a,b)=>b.score - a.score);

    const picks = [];
    for(const c of candidates){
      if(picks.length >= 3) break;
      const tooClose = picks.some(p=>Math.abs(p.slotUtc-c.slotUtc) < 90*60000);
      if(!tooClose) picks.push(c);
    }

    renderResults(picks, dateVal, prefStart, prefEnd);
  }, 650);
}

function showSearchingState(){
  document.getElementById('resultsArea').innerHTML = `
    <div class="searching-state fade-up">
      <div class="searching-emoji">✨</div>
      <div>Twine is finding the perfect time...</div>
      <div class="searching-sub">Looking across timezones</div>
    </div>
  `;
}

function scoreComfort(min, prefStart, prefEnd){
  if(min >= prefStart && min < prefEnd) return 'great';
  const h = Math.floor(min/60);
  if(h >= 7 && h < 22) return 'ok';
  return 'bad';
}

/* ══ Render results ══ */
function renderResults(picks, dateVal, prefStart, prefEnd){
  const [y,mo,d] = dateVal.split('-').map(Number);
  const dateLabel = new Date(y,mo-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const now = new Date();
  const ownerNowMin = getMinutesInTz(ownerTz, now);
  const allEntries = [{...ownerEntry, isOwner:true, id:'owner'}, ...participants];

  let html = `<div class="fade-up">`;

  /* — Glance — */
  html += `
    <div class="glance-label"><div class="glance-dot"></div>🌍 Everyone's local time</div>
    <div class="glance-card">
      <div class="glance-row">
        <div class="glance-left">
          <span class="glance-flag">${ownerEntry.flag}</span>
          <div>
            <div class="glance-city">${ownerEntry.label}</div>
            <div class="glance-utc">${getUtcLabel(ownerTz)}</div>
          </div>
        </div>
        <div class="glance-right">
          <div class="glance-time" id="glance-time-owner">${getTimeInTz(ownerTz,now)}</div>
          <div class="you-badge">You</div>
        </div>
      </div>
      ${participants.map(p=>`
      <div class="glance-row">
        <div class="glance-left">
          <span class="glance-flag">${p.flag}</span>
          <div>
            <div class="glance-city">${p.label}</div>
            <div class="glance-utc">${getUtcLabel(p.tz)}</div>
          </div>
        </div>
        <div class="glance-right">
          <div class="glance-time" id="glance-time-${p.id}">${getTimeInTz(p.tz,now)}</div>
        </div>
      </div>`).join('')}
    </div>
  `;

  /* — Outcome banner + best match hero card — */
  const allGreatBest = picks.length && picks[0].comfort.every(c=>c.c==='great');
  html += allGreatBest
    ? `<div class="outcome-banner"><span class="outcome-emoji">🎉</span><span><b>Perfect!</b> Everyone's comfortably within working hours.</span></div>`
    : `<div class="outcome-banner"><span class="outcome-emoji">🌸</span><span>Twine found a few good options for ${dateLabel}.</span></div>`;

  if(picks.length){
    const best = picks[0];
    const bestAllBad = best.comfort.every(c=>c.c==='bad');
    const ownerTime = getTimeInTz(ownerTz, best.slotUtc);
    const copyTextBest = buildCopyText(best, dateLabel, allEntries);
    const ownerStop = best.comfort.find(c=>c.p.isOwner);
    const otherStops = best.comfort.filter(c=>!c.p.isOwner);

    function renderStop({p,c,time}){
      const pipCls = c==='great'?'pip-great':c==='ok'?'pip-ok':'pip-bad';
      return `
        <div class="best-stop">
          <div class="best-stop-time">${time}</div>
          <div class="best-stop-place">
            <div class="comfort-pip ${pipCls}"></div>
            <span class="best-stop-flag">${p.flag}</span>
            ${p.city}${p.isOwner?' (you)':''}
          </div>
        </div>`;
    }

    // First two stops get the large vertical treatment (matches the spec's two-city example);
    // any additional participants list below in the compact row style.
    const primaryStops = [ownerStop, ...otherStops.slice(0,1)].filter(Boolean);
    const extraStops = otherStops.slice(1);

    html += `
      <div class="best-card fade-up" onclick="toggleCopyRow('best')">
        <div class="best-card-glow"></div>
        <div class="best-card-glow-2"></div>
        <div class="best-eyebrow"><span class="sparkle">💜</span> We found a great time!</div>
        <div class="best-stops">
          ${primaryStops.map((s,i)=>{
            const time = getTimeInTz(s.p.tz, best.slotUtc);
            return renderStop({...s, time}) + (i===0 && primaryStops.length>1 ? '<div class="best-arrow">↓</div>' : '');
          }).join('')}
        </div>
        <div class="best-note">${friendlyNote(best, bestAllBad)}</div>
        ${extraStops.length ? `
        <div class="best-people-extra">
          ${extraStops.map(({p,c})=>{
            const pipCls = c==='great'?'pip-great':c==='ok'?'pip-ok':'pip-bad';
            const pTime = getTimeInTz(p.tz, best.slotUtc);
            return `<div class="best-person-row">
              <div class="best-person-left">
                <div class="comfort-pip ${pipCls}"></div>
                <span class="best-person-flag">${p.flag}</span>
                ${p.city}
              </div>
              <div class="best-person-time">${pTime}</div>
            </div>`;
          }).join('')}
        </div>` : ''}
        <div class="best-copy-row" id="copyrow-best" style="display:none">
          <button class="copy-btn" onclick="doCopy(event,'${encodeURIComponent(copyTextBest)}',this)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copy times for everyone
          </button>
        </div>
      </div>
    `;
  }

  /* — Alternatives: compact, secondary — */
  const alts = picks.slice(1);
  if(alts.length){
    html += `<div class="alt-label">A couple of other options</div>`;
    alts.forEach((pick, i)=>{
      const hasBad = pick.comfort.some(c=>c.c==='bad');
      const earlyLate = pick.comfort.filter(c=>c.c==='bad').map(({m})=>m<420?'early':'late');
      const word = earlyLate.includes('late') ? 'A little late' : 'A little early';
      const badge = hasBad ? `🌙 ${word}` : '🌼 Pretty good';
      const badgeCls = hasBad ? 'badge-rough' : 'badge-works';
      const ownerTime = getTimeInTz(ownerTz, pick.slotUtc);
      const peopleInline = pick.comfort.filter(c=>!c.p.isOwner).map(({p})=>`${p.flag} ${getTimeInTz(p.tz,pick.slotUtc)}`).join('  ·  ');
      const copyTextAlt = buildCopyText(pick, dateLabel, allEntries);
      const altId = `alt${i}`;

      html += `
        <div class="alt-card fade-up" onclick="toggleCopyRow('${altId}')">
          <div class="alt-row">
            <div class="alt-left">
              <span class="alt-time">${ownerTime}</span>
              <span class="alt-people-inline">${peopleInline}</span>
            </div>
            <div class="badge ${badgeCls}">${badge}</div>
          </div>
          <div class="alt-copy-row" id="copyrow-${altId}">
            <button class="copy-btn" onclick="doCopy(event,'${encodeURIComponent(copyTextAlt)}',this)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              Copy times for everyone
            </button>
          </div>
        </div>
      `;
    });
  }

  /* — Timeline — */
  html += renderTimeline(picks, allEntries, prefStart, prefEnd, now);

  html += `</div>`;
  document.getElementById('resultsArea').innerHTML = html;
}

function friendlyNote(pick, allBad){
  if(allBad) return `This is the closest fit we found — someone will be outside their usual hours, but it's the best overlap available.`;
  const great = pick.comfort.filter(c=>c.c==='great').length;
  const total = pick.comfort.length;
  if(great === total) return `This sits right in everyone's preferred hours — about as easy as it gets.`;
  return `Most people are comfortable here, with one or two just outside their preferred window.`;
}

function buildCopyText(pick, dateLabel, allEntries){
  const lines = [`Meeting on ${dateLabel}:`];
  pick.comfort.forEach(({p})=>{
    lines.push(`${p.flag} ${p.label||p.city}: ${getTimeInTz(p.tz, pick.slotUtc)}`);
  });
  return lines.join('\n');
}

function toggleCopyRow(idx){
  const el = document.getElementById(`copyrow-${idx}`);
  if(el) el.style.display = el.style.display==='none'?'block':'none';
}
function doCopy(e, encoded, btn){
  e.stopPropagation();
  const text = decodeURIComponent(encoded);

  function showCopied(){
    btn.textContent = '✓ Copied!';
    setTimeout(()=>{ btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy times for everyone`; }, 2000);
  }
  function showFailed(){
    btn.textContent = 'Copy failed — select text manually';
    setTimeout(()=>{ btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy times for everyone`; }, 2500);
  }

  // Fallback for contexts where the Clipboard API is unavailable or blocked:
  // sandboxed iframes (like in-chat previews), file:// pages, and non-HTTPS origins
  // all commonly block navigator.clipboard. document.execCommand('copy') via a
  // temporary textarea works in those same contexts as a reliable fallback.
  function legacyCopy(){
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(err) { ok = false; }
    document.body.removeChild(textarea);
    if (ok) showCopied(); else showFailed();
  }

  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false) {
    navigator.clipboard.writeText(text).then(showCopied).catch(legacyCopy);
  } else {
    legacyCopy();
  }
}

/* ══ Timeline ══ */
function renderTimeline(picks, allEntries, prefStart, prefEnd, now){
  const nowOwnerMin = getMinutesInTz(ownerTz, now);
  const nowPct = (nowOwnerMin/1440)*100;

  let html = `<div class="timeline-card">
    <div class="timeline-head">🌍 A look across everyone's day</div>`;

  allEntries.forEach(p=>{
    const tzDiff = getTzOffsetMinutes(p.tz, now) - getTzOffsetMinutes(ownerTz, now);
    const pref0 = Math.max(0, prefStart + tzDiff);
    const pref1 = Math.min(1440, prefEnd + tzDiff);
    const ok0 = Math.max(0, 7*60 + tzDiff);
    const ok1 = Math.min(1440, 22*60 + tzDiff);
    const pct = v => Math.min(100, Math.max(0, (v/1440)*100));

    const curMin = getMinutesInTz(p.tz, now);
    const curHour = Math.floor(curMin/60);
    const dayIcon = (curHour >= 6 && curHour < 18) ? '☀️' : '🌙';
    const bestPct = picks.length ? pct(getMinutesInTz(p.tz,picks[0].slotUtc)) : null;

    html += `<div class="tl-row">
      <div class="tl-city"><span>${dayIcon}</span><span>${p.flag}</span>${p.label||p.city}${p.isOwner?' (you)':''}</div>
      <div class="tl-bar-wrap">
        <div class="tl-bar">
          <div class="tl-seg tl-seg-ok" style="left:${pct(ok0)}%;width:${pct(ok1)-pct(ok0)}%"></div>
          ${pref1>pref0?`<div class="tl-seg tl-seg-pref" style="left:${pct(pref0)}%;width:${pct(pref1)-pct(pref0)}%"></div>`:''}
          ${bestPct!==null?`<div class="tl-best" style="left:${bestPct}%"></div>`:''}
          ${p.isOwner?`<div class="tl-now" style="left:${nowPct}%"></div>`:''}
        </div>
        ${bestPct!==null?`<span class="tl-best-sparkle" style="left:${bestPct}%">✨</span>`:''}
      </div>
      <div class="tl-hours"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>12am</span></div>
    </div>`;
  });

  html += `<div class="tl-legend">
    <div class="tl-legend-item"><div class="tl-legend-dot" style="background:linear-gradient(90deg, rgba(201,168,232,0.6), rgba(232,184,212,0.6))"></div>Preferred hours</div>
    <div class="tl-legend-item"><div class="tl-legend-dot" style="background:rgba(201,168,232,0.18)"></div>Workable hours</div>
    <div class="tl-legend-item">✨ Recommended overlap</div>
  </div>
  </div>`;

  return html;
}

init();
