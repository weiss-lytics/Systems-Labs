<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Twine: Finding time, together.</title>
  <desc id="d">Manila and London are added, working hours set to 9 to 6, and Twine finds 4:00 PM in Manila and 9:00 AM in London, then copies the summary.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5a466e" flood-opacity=".10"/></filter>
    <clipPath id="sw"><rect x="420" y="280" width="0" height="80"><animate attributeName="width" values="0;0;325;325;0" keyTimes="0;.31;.43;.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <g id="face"><circle r="54" fill="#fffefd"/><circle r="44" fill="none" stroke="#e6deef" stroke-width="1.5"/><circle r="4" fill="#6b5280"/></g>
    <style>
      text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#2d293a}
      .cap{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#735c82}
      .m{font-size:13px;fill:#7d778a}.b{font-weight:700}.w{fill:#fff}.a{fill:#735c82}
      .fld{fill:#fbfafc;stroke:#e8e4ec}.hand{stroke:#6b5280;stroke-linecap:round}
    </style>
  </defs>

  <rect width="800" height="450" rx="24" fill="#faf9f7"/>

  <!-- LEFT: the plan -->
  <rect x="36" y="36" width="340" height="378" rx="24" fill="#fffefd" stroke="#e8e4ec" filter="url(#sh)"/>
  <text x="56" y="68" class="cap">LET’S MAKE A PLAN</text>
  <text x="56" y="98" font-size="22" font-weight="700">Where is everyone?</text>
  <text x="56" y="120" class="m">Your location</text>
  <rect x="56" y="128" width="300" height="44" rx="14" class="fld"/>
  <rect x="70" y="139" width="30" height="22" rx="7" fill="#ece5f1"/><text x="85" y="154" font-size="12" font-weight="700" class="a" text-anchor="middle">PH</text>
  <text x="110" y="156" font-size="15" font-weight="700">Philippines — Manila</text>
  <rect x="296" y="141" width="52" height="20" rx="10" fill="#ece5f1"/><text x="322" y="155" font-size="11.5" class="m" text-anchor="middle">UTC+8</text>
  <text x="56" y="196" class="m">Meeting with</text>
  <rect x="56" y="204" width="300" height="44" rx="14" class="fld"/>
  <rect x="70" y="215" width="30" height="22" rx="7" fill="#ece5f1"/><text x="85" y="230" font-size="12" font-weight="700" class="a" text-anchor="middle">GB</text>
  <text x="110" y="232" font-size="15" font-weight="700">UK — London</text>
  <rect x="296" y="217" width="52" height="20" rx="10" fill="#ece5f1"/><text x="322" y="231" font-size="11.5" class="m" text-anchor="middle">UTC+1</text>
  <text x="56" y="276" class="m">Your working hours</text>
  <rect x="56" y="284" width="186" height="38" rx="14" class="fld"/><text x="72" y="308" font-size="14" font-weight="700">9:00 AM → 6:00 PM</text>
  <rect x="252" y="286" width="104" height="34" rx="10" fill="#ece5f1" stroke="#a58bbd"/><text x="304" y="308" font-size="13" font-weight="700" class="a" text-anchor="middle">✦ Standard</text>
  <rect x="56" y="346" width="300" height="48" rx="14" fill="#735c82">
    <animate attributeName="fill" values="#735c82;#735c82;#54406a;#735c82;#735c82" keyTimes="0;.2;.225;.26;1" dur="9s" repeatCount="indefinite"/></rect>
  <text x="206" y="376" font-size="15" font-weight="700" class="w" text-anchor="middle">Find a time that works
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.22;.26;.9;.94;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="206" y="376" font-size="15" font-weight="700" class="w" text-anchor="middle" opacity="0">Find another time
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.22;.27;.88;.92;1" dur="9s" repeatCount="indefinite"/></text>

  <!-- RIGHT: lilac panel -->
  <rect x="400" y="36" width="364" height="378" rx="24" fill="#ece5f1"/>

  <!-- idle: a better way to sync -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.2;.27;.88;.95;1" dur="9s" repeatCount="indefinite"/>
    <text x="424" y="68" class="cap">A BETTER WAY TO SYNC</text>
    <use href="#face" x="520" y="168"/><use href="#face" x="646" y="288"/>
    <g transform="translate(520 168)"><line class="hand" y2="-26" stroke-width="4" transform="rotate(305)"/><line class="hand" y2="-38" stroke-width="3" transform="rotate(60)"/></g>
    <g transform="translate(646 288)"><line class="hand" y2="-26" stroke-width="4" transform="rotate(95)"/><line class="hand" y2="-38" stroke-width="3" transform="rotate(60)"/></g>
    <text x="520" y="248" font-size="14" font-weight="700" text-anchor="middle">Manila</text><text x="520" y="266" class="m" text-anchor="middle">10:10 AM</text>
    <text x="646" y="368" font-size="14" font-weight="700" text-anchor="middle">London</text><text x="646" y="386" class="m" text-anchor="middle">3:10 AM</text>
    <text x="424" y="300" font-size="15" font-style="italic" fill="#735c82" style="fill:#735c82">Different places.</text>
    <text x="424" y="320" font-size="15" font-style="italic" style="fill:#735c82">One good moment.</text>
  </g>

  <!-- result: the pick -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.29;.86;.93;1" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0;0 0" keyTimes="0;.2;.3;1" dur="9s" repeatCount="indefinite"/>
    <rect x="424" y="52" width="132" height="26" rx="13" fill="#fffefd"/><text x="490" y="70" font-size="12" font-weight="700" class="a" text-anchor="middle">✦ Recommended</text>
    <text x="424" y="112" font-size="24" font-weight="700">We found a great time!</text>
    <rect x="424" y="124" width="316" height="112" rx="18" fill="#fffefd" stroke="#e8e4ec"/>
    <text x="444" y="150" class="cap">YOUR TIME · MANILA</text>
    <text x="444" y="204" font-size="32" font-weight="700" style="fill:#6b5280">4:00 PM</text>
    <text x="720" y="150" class="cap" text-anchor="end">LONDON</text>
    <text x="720" y="204" font-size="22" font-weight="700" text-anchor="end">9:00 AM</text>
    <rect x="424" y="246" width="176" height="26" rx="13" fill="#fffefd"/><text x="512" y="264" font-size="13" font-weight="700" class="a" text-anchor="middle">♥ Ideal for everyone</text>
    <text x="424" y="288" class="m">Manila</text><text x="740" y="288" class="m" text-anchor="end">Both in working hours</text>
    <g stroke-width="16" fill="none" stroke-dasharray="11 2.25">
      <path d="M424 302h315.75M424 342h315.75" stroke="#e1dbe8"/>
      <g clip-path="url(#sw)" stroke="#c9bbdc"><path d="M543.25 302h117M424 342h11M636 342h103.75"/></g>
    </g>
    <text x="424" y="328" class="m">London</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.46;.9;.95" dur="9s" repeatCount="indefinite"/>
      <rect x="632" y="288" width="19" height="68" rx="8" fill="#735c82" opacity=".14"/>
      <rect x="636" y="294" width="11" height="16" rx="3" fill="#6b5280"/><rect x="636" y="334" width="11" height="16" rx="3" fill="#6b5280"/>
    </g>
    <rect x="424" y="366" width="316" height="34" rx="12" fill="#735c82">
      <animate attributeName="fill" values="#735c82;#735c82;#54406a;#735c82;#735c82" keyTimes="0;.6;.625;.66;1" dur="9s" repeatCount="indefinite"/></rect>
    <text x="582" y="388" font-size="14" font-weight="700" class="w" text-anchor="middle">Copy meeting summary
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.62;.64;.9;.92" dur="9s" repeatCount="indefinite"/></text>
    <text x="582" y="388" font-size="14" font-weight="700" class="w" text-anchor="middle" opacity="0">✓ Copied!
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.62;.65;.86;.9;1" dur="9s" repeatCount="indefinite"/></text>
  </g>

  <!-- cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.08;.12;.7;.75;1" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" calcMode="spline"
      values="330 440;300 430;236 372;236 372;420 420;560 430;590 386;590 386;700 430;700 430"
      keyTimes="0;.1;.21;.245;.33;.55;.6;.66;.73;1"
      keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1" dur="9s" repeatCount="indefinite"/>
    <path d="M0 0v20l5-5 4 9 3-1.5-4-9h7z" fill="#2d293a" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
