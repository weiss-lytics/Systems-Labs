<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiro — Product Wireframe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#3a3d3a;
    --ink-soft:#6b6f6b;
    --paper:#f6f6f3;
    --paper-line: rgba(58,61,58,0.08);
    --sage:#8AA68C;
    --sage-deep:#5f7d64;
    --sage-pale: rgba(138,166,140,0.14);
    --sticky:#fbf3d0;
    --sticky-edge:#e8dca0;
    --dash: rgba(58,61,58,0.35);
    --white:#fffefb;
    --shadow: 0 1px 0 rgba(58,61,58,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color:var(--ink);
    background:
      linear-gradient(var(--paper-line) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px) 0 0/28px 28px,
      var(--paper);
    min-height:100vh;
  }
  .hand{
    font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
    color: var(--sage-deep);
  }

  /* ---------- App Shell ---------- */
  .app{
    display:flex;
    min-height:100vh;
  }
  nav.sidebar{
    width:216px;
    flex-shrink:0;
    padding:26px 14px;
    border-right:1px dashed var(--dash);
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    font-size:20px;
    font-weight:600;
    letter-spacing:0.5px;
    margin-bottom:2px;
  }
  .brand-tag{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:22px;
  }
  .nav-item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
    border:1px dashed transparent;
    transition: all .15s ease;
    margin-bottom:2px;
  }
  .nav-item .n{
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.6;
    width:16px;
  }
  .nav-item:hover{ background:var(--sage-pale); color:var(--ink); }
  .nav-item.active{
    background:var(--white);
    border:1px dashed var(--sage);
    color:var(--ink);
    font-weight:600;
    box-shadow:var(--shadow);
  }
  .sidebar-footer{
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--dash);
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .anno-toggle{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:11.5px;
    padding:8px 10px;
    border:1px dashed var(--dash);
    border-radius:8px;
    cursor:pointer;
    background:var(--white);
  }
  .switch{
    width:30px;height:16px;border-radius:20px;background:var(--dash);
    position:relative; transition:.2s;
  }
  .switch::after{
    content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:var(--white); transition:.2s;
  }
  .switch.on{ background:var(--sage); }
  .switch.on::after{ left:16px; }

  main.canvas{
    flex:1;
    padding:44px 56px 90px;
    max-width:1180px;
    scroll-behavior:smooth;
  }
  .screen{
    display:none;
    animation: fadeIn .35s ease;
  }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.6px;
    color:var(--sage-deep);
    margin-bottom:6px;
  }
  h1.screen-title{
    font-size:30px;
    margin:0 0 6px;
    font-weight:600;
  }
  .screen-purpose{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:30px;
    max-width:640px;
  }

  .frame{
    border:1.5px dashed var(--dash);
    border-radius:18px;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 28px),
                repeating-linear-gradient(90deg, transparent, transparent 27px, var(--paper-line) 28px),
                var(--white);
    padding:36px;
    position:relative;
    min-height:420px;
  }
  .frame-label{
    position:absolute;
    top:-13px; left:24px;
    background:var(--paper);
    padding:0 8px;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.5px;
  }

  .note{
    background:var(--sticky);
    border:1px solid var(--sticky-edge);
    border-radius:3px;
    padding:12px 14px;
    font-size:12.5px;
    line-height:1.45;
    box-shadow: 2px 3px 6px rgba(58,61,58,0.10);
    max-width:220px;
    cursor:pointer;
  }
  .note b{ display:block; margin-bottom:4px; font-size:12.5px;}
  .note.tilt-l{ transform:rotate(-2.2deg); }
  .note.tilt-r{ transform:rotate(2deg); }
  .note.collapsed .note-body{ display:none; }
  .note .expand-hint{ font-size:10px; color:var(--ink-soft); margin-top:6px; }

  .annotation{
    font-size:12px;
    color:var(--sage-deep);
    border-left:2px dashed var(--sage);
    padding-left:10px;
    margin:14px 0;
    max-width:480px;
  }
  .anno-hidden .annotation, .anno-hidden .note{ display:none !important; }

  .callout-strip{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:26px;
  }

  .dashed-btn{
    border:1.5px dashed var(--ink);
    border-radius:10px;
    background:transparent;
    padding:12px 18px;
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
  }
  .dashed-btn:hover{ background:var(--sage-pale); border-color:var(--sage-deep); }
  .dashed-btn.primary{ border-color:var(--sage-deep); background:var(--sage-pale); font-weight:600; }

  .field-row{
    border:1.5px dashed var(--dash);
    border-radius:10px;
    padding:11px 14px;
    margin-bottom:12px;
    background:var(--white);
  }
  .field-row label{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field-row .val{ font-size:14.5px; }

  .arrow-flow{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-size:13px; color:var(--ink-soft);
  }
  .arrow-flow .node{
    border:1.5px dashed var(--dash);
    border-radius:10px;
    padding:8px 14px;
    background:var(--white);
    color:var(--ink);
  }
  .arrow-flow .arrow{ color:var(--sage-deep); font-size:16px; }

  .footer-nav{
    position:fixed;
    bottom:0; left:216px; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 56px;
    background:linear-gradient(0deg, var(--paper) 60%, rgba(246,246,243,0));
  }
  .progress-dots{ display:flex; gap:6px; }
  .progress-dots span{
    width:6px;height:6px;border-radius:50%;background:var(--dash);
  }
  .progress-dots span.active{ background:var(--sage-deep); width:16px; border-radius:3px; }

  /* Cover */
  .cover-illustration{
    display:flex; align-items:center; gap:14px; margin:22px 0 8px; flex-wrap:wrap;
  }
  .principle-card{
    border:1.5px dashed var(--dash);
    border-radius:14px;
    padding:18px;
    flex:1;
    min-width:170px;
    background:var(--white);
  }
  .principle-card .hand{ font-size:13px; }
  .principle-card h3{ margin:6px 0 6px; font-size:15px; }
  .principle-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); }

  /* Home screen phone */
  .phone{
    width:280px;
    border:1.5px dashed var(--dash);
    border-radius:32px;
    padding:22px 16px;
    margin:0 auto;
    background:var(--white);
    position:relative;
  }
  .phone .notch{
    width:70px;height:6px;border-radius:6px;background:var(--paper-line);
    margin:0 auto 18px;
  }
  .logo-mark{
    width:56px;height:56px;border-radius:16px;border:2px dashed var(--sage-deep);
    display:flex;align-items:center;justify-content:center;
    margin:6px auto 10px; font-size:22px;
  }
  .home-tagline{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:22px;}
  .action-btn{
    border:1.5px dashed var(--sage-deep);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    text-align:center;
    background:var(--sage-pale);
    font-size:14px;
  }
  .action-btn.secondary{ background:var(--white); border-style:dashed; border-color:var(--dash); }
  .privacy-line{
    text-align:center; font-size:11px; color:var(--sage-deep); margin-top:16px; line-height:1.4;
  }

  .two-col{ display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
  .col{ flex:1; min-width:260px; }

  .receipt-mock{
    border:1.5px dashed var(--dash);
    border-radius:6px;
    background:var(--white);
    padding:20px;
    font-size:12px;
    position:relative;
    line-height:1.7;
  }
  .receipt-mock .rline{ border-bottom:1px dashed var(--paper-line); padding:3px 0; }
  .highlight-region{
    outline:2px dashed var(--sage);
    border-radius:4px;
    padding:0 3px;
  }

  .checklist-item{ display:flex; gap:10px; align-items:center; font-size:14px; margin-bottom:10px; }
  .checklist-item .mark{
    width:20px;height:20px;border-radius:50%;
    border:1.5px dashed var(--dash);
    display:flex;align-items:center;justify-content:center;
    font-size:11px; flex-shrink:0;
  }
  .checklist-item.done .mark{ background:var(--sage-pale); border-color:var(--sage-deep); color:var(--sage-deep); }

  .roadmap-track{
    display:flex; gap:0; align-items:stretch; flex-wrap:wrap;
  }
  .roadmap-stage{
    flex:1; min-width:190px;
    border:1.5px dashed var(--dash);
    border-radius:14px;
    padding:16px;
    margin:6px;
    background:var(--white);
  }
  .roadmap-stage .ver{
    font-size:11px; letter-spacing:1px; color:var(--sage-deep); font-weight:700; margin-bottom:8px;
  }
  .roadmap-stage ul{ margin:0; padding-left:16px; font-size:12.5px; color:var(--ink-soft); }

  .arch-row{ display:flex; align-items:center; gap:16px; margin-bottom:4px; flex-wrap:wrap; }
  .arch-node{
    border:1.5px dashed var(--dash);
    border-radius:10px;
    padding:10px 16px;
    background:var(--white);
    font-size:13px;
    min-width:170px;
    text-align:center;
  }
  .arch-explain{
    font-size:11.5px; color:var(--ink-soft); max-width:340px;
  }
  .arch-secure{
    color:var(--sage-deep); font-weight:600;
  }

  .upload-zone{
    border:2px dashed var(--sage);
    border-radius:18px;
    padding:50px 20px;
    text-align:center;
    background:var(--sage-pale);
    font-size:14px;
  }

  .success-mark{
    width:80px;height:80px;border-radius:50%;
    border:2px dashed var(--sage-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:34px; color:var(--sage-deep);
    margin:10px auto 18px;
  }

  @media (max-width: 760px){
    .app{ flex-direction:column; }
    nav.sidebar{ width:100%; height:auto; position:relative; border-right:none; border-bottom:1px dashed var(--dash); }
    main.canvas{ padding:24px; }
    .footer-nav{ left:0; padding:14px 24px; }
  }

  button:focus-visible, .nav-item:focus-visible, .note:focus-visible{
    outline:2px solid var(--sage-deep); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar">
    <div class="brand">Kiro</div>
    <div class="brand-tag">Less typing. More recording.</div>
    <div id="navList"></div>
    <div class="anno-toggle" id="annoToggle">
      <span>UX annotations</span>
      <div class="switch on" id="annoSwitch"></div>
    </div>
    <div class="sidebar-footer">
      Low-fidelity product wireframe.<br>Use ← → or the nav to move through the flow.
    </div>

  <main class="canvas" id="canvas"></main>
</div>

<div class="footer-nav">
  <button class="dashed-btn" id="prevBtn">← Previous</button>
  <div class="progress-dots" id="dots"></div>
  <button class="dashed-btn primary" id="nextBtn">Next →</button>
</div>

let current = 0;
let annoOn = true;

function renderNav(){
  const navList = document.getElementById('navList');
  navList.innerHTML = screens.map((s,i)=>
    `<div class="nav-item${i===current?' active':''}" data-i="${i}" tabindex="0">
      <span class="n">${String(i+1).padStart(2,'0')}</span><span>${s.label}</span>
    </div>`
  ).join('');
  navList.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ current = parseInt(el.dataset.i); render(); });
  });
}

function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = screens.map((s,i)=>`<span class="${i===current?'active':''}"></span>`).join('');
}

function render(){
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = `<div class="screen active">${content[screens[current].id]}</div>`;
  canvas.className = 'canvas' + (annoOn ? '' : ' anno-hidden');
  renderNav();
  renderDots();
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===screens.length-1 ? 'Restart ↺' : 'Next →';
  window.scrollTo({top:0, behavior:'smooth'});

  // expandable sticky notes
  canvas.querySelectorAll('.note').forEach(n=>{
    if(!n.querySelector('.expand-hint')){
      const hint = document.createElement('div');
      hint.className = 'expand-hint';
      hint.textContent = 'tap to collapse';
      n.appendChild(hint);
    }
    n.addEventListener('click', ()=>{
      n.classList.toggle('collapsed');
    });
  });
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(current>0){ current--; render(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  current = (current+1) % screens.length; render();
});
document.getElementById('annoToggle').addEventListener('click', ()=>{
  annoOn = !annoOn;
  document.getElementById('annoSwitch').classList.toggle('on', annoOn);
  document.getElementById('canvas').classList.toggle('anno-hidden', !annoOn);
});

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});

render();
</script>
