<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shiori: a task card moves from Inbox to In Progress to Done, completing a checklist and filling a progress ring along the way.">

  <!--
    SHIORI — hero motion narrative (7s loop, native SMIL, no JS)

    STORY: one task card travels Inbox -> In Progress -> Done.
    Its checklist fills in as it moves. On arrival at Done it tints
    into the brand palette and a check badge blooms. A corner
    progress ring fills in lockstep with the card's real journey —
    the same ring used on the app's dashboard. Loop fades naturally.

    Every motion maps to a real feature: kanban movement, checklist
    completion, and the dashboard progress ring. Nothing here is
    decorative.
  -->

  <defs>
    <!-- Brand palette, matching the app exactly -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F4FC"/>
      <stop offset="100%" stop-color="#EFEBFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B8AC4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9B8AC4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3A3550" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ============ CANVAS ============ -->
  <rect x="0" y="0" width="800" height="400" rx="24" fill="url(#bg)"/>

  <!-- ============ LANES (the kanban board) ============ -->
  <!-- Lane 1: Inbox -->
  <rect x="40" y="70" width="220" height="260" rx="18" fill="#FBFAFF" stroke="#E2DEF3" stroke-width="1.5"/>
  <circle cx="150" cy="104" r="8" fill="none" stroke="#A29DBF" stroke-width="2.5"/>

  <!-- Lane 2: In Progress -->
  <rect x="290" y="70" width="220" height="260" rx="18" fill="#FBFAFF" stroke="#E2DEF3" stroke-width="1.5"/>
  <path d="M 396 98 L 410 104 L 396 110 Z" fill="#D9A3C0"/>

  <!-- Lane 3: Done -->
  <rect x="540" y="70" width="220" height="260" rx="18" fill="#FBFAFF" stroke="#E2DEF3" stroke-width="1.5"/>
  <path d="M 640 98 L 645 106 L 658 92" fill="none" stroke="#9B8AC4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ THE TASK CARD (focal point) ============ -->
  <!-- Positioned at Inbox center via transform; animateMotion carries
       it Inbox -> In Progress -> Done along a straight horizontal path.
       Whole group fades in/out at loop boundaries for a clean cycle. -->
  <g transform="translate(150,200)">
    <animate attributeName="opacity"
      dur="7s" repeatCount="indefinite"
      keyTimes="0; 0.02; 0.94; 1"
      values="0; 1; 1; 0"/>

    <g>
      <!-- Motion: Inbox -> In Progress (arrive 2.6s) -> dwell -> In Progress -> Done (arrive 5.2s) -->
      <animateMotion dur="7s" repeatCount="indefinite"
        path="M 0,0 L 500,0"
        keyPoints="0; 0; 0.5; 0.5; 1; 1"
        keyTimes="0; 0.143; 0.371; 0.514; 0.743; 1"
        keySplines="0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0 0 1 1; 0 0 1 1"
        calcMode="spline"/>

      <!-- Pickup pulse: a soft ring highlight showing the card is "active" before it moves -->
      <rect x="-100" y="-55" width="200" height="110" rx="20"
        fill="none" stroke="#9B8AC4" stroke-width="2">
        <animate attributeName="stroke-opacity"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.043; 0.09; 0.129; 1"
          values="0; 0; 0.5; 0; 0"/>
      </rect>

      <!-- Card body: tints from neutral to brand periwinkle on completion -->
      <rect id="cardBody" x="-95" y="-50" width="190" height="100" rx="16"
        filter="url(#soft-shadow)">
        <animate attributeName="fill"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.743; 0.8; 1"
          values="#FBFAFF; #FBFAFF; #EFEAFB; #EFEAFB"/>
        <animate attributeName="stroke"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.743; 0.8; 1"
          values="#E2DEF3; #E2DEF3; #9B8AC4; #9B8AC4"/>
      </rect>

      <!-- Priority dot + title bar (kept abstract, not text, so the story
           reads without reading anything) -->
      <circle cx="-75" cy="-28" r="5" fill="#D9A3C0"/>
      <rect x="-58" y="-32" width="90" height="8" rx="4" fill="#D8D4EC"/>

      <!-- Checklist: three rows, each a track + a checkmark that draws in
           exactly when the card arrives at the lane where that work happens -->
      <!-- Row 1 -->
      <rect x="-75" y="-4" width="150" height="6" rx="3" fill="#EDEAF7"/>
      <path d="M -78,-1 L -73,4 L -63,-8" fill="none" stroke="#9B8AC4" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="26" >
        <animate attributeName="stroke-dashoffset"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.371; 0.421; 1"
          values="26; 26; 0; 0"/>
      </path>

      <!-- Row 2 -->
      <rect x="-75" y="16" width="150" height="6" rx="3" fill="#EDEAF7"/>
      <path d="M -78,19 L -73,24 L -63,12" fill="none" stroke="#9B8AC4" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="26">
        <animate attributeName="stroke-dashoffset"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.421; 0.471; 1"
          values="26; 26; 0; 0"/>
      </path>

      <!-- Row 3 (completes only once the card reaches Done) -->
      <rect x="-75" y="36" width="150" height="6" rx="3" fill="#EDEAF7"/>
      <path d="M -78,39 L -73,44 L -63,32" fill="none" stroke="#9B8AC4" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="26">
        <animate attributeName="stroke-dashoffset"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.743; 0.793; 1"
          values="26; 26; 0; 0"/>
      </path>

      <!-- Completion badge: blooms once, on arrival at Done -->
      <g>
        <animateTransform attributeName="transform" type="scale"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.743; 0.78; 0.82; 1"
          values="0; 0; 1.15; 1; 1"
          additive="sum"/>
        <animate attributeName="opacity"
          dur="7s" repeatCount="indefinite"
          keyTimes="0; 0.743; 0.75; 1"
          values="0; 0; 1; 1"/>
        <circle cx="78" cy="-33" r="15" fill="#9B8AC4"/>
        <path d="M 72,-33 L 77,-28 L 85,-39" fill="none" stroke="#FBFAFF"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- ============ DASHBOARD PROGRESS RING ============ -->
  <!-- Fills in step with the card's real journey — not an arbitrary loader.
       The breathing glow behind it is the app's one ambient signature. -->
  <g transform="translate(716,352)">
    <circle r="30" fill="url(#glow)">
      <animateTransform attributeName="transform" type="scale"
        dur="5.2s" repeatCount="indefinite"
        keyTimes="0; 0.5; 1" values="0.92; 1.06; 0.92"/>
      <animate attributeName="opacity"
        dur="5.2s" repeatCount="indefinite"
        keyTimes="0; 0.5; 1" values="0.5; 0.85; 0.5"/>
    </circle>
    <circle r="22" fill="none" stroke="#E2DEF3" stroke-width="5"/>
    <circle r="22" fill="none" stroke="#9B8AC4" stroke-width="5"
      stroke-linecap="round" transform="rotate(-90)"
      stroke-dasharray="138.2">
      <animate attributeName="stroke-dashoffset"
        dur="7s" repeatCount="indefinite"
        keyTimes="0; 0.143; 0.371; 0.514; 0.743; 0.9; 1"
        values="138.2; 138.2; 92; 92; 0; 0; 138.2"/>
    </circle>
  </g>

  <!-- ============ AMBIENT DUST (tiny, quiet — reinforces "calm") ============ -->
  <circle cx="60" cy="340" r="2.5" fill="#D9A3C0" opacity="0.4">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.5;1" values="0.15;0.5;0.15"/>
  </circle>
  <circle cx="740" cy="60" r="2.5" fill="#9B8AC4" opacity="0.3">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
      keyTimes="0;0.5;1" values="0.3;0.15;0.3"/>
  </circle>
</svg>
